<!doctype html><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoTrade · 策略总览</title>
<style>
body{font-family:system-ui,'Microsoft YaHei',sans-serif;max-width:880px;
margin:0 auto;padding:16px 14px 48px;color:#1a1a1a;line-height:1.6}
a{color:#1f6feb}
.banner{background:#eef4ff;border:1px solid #c9d9f5;border-radius:8px;
padding:10px 14px;font-size:13px;color:#31527d;margin:12px 0}
.banner.real{background:#fff6e5;border-color:#f3d9a4;color:#8a5a00}
.kpi{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.kpi div{flex:1;min-width:130px;background:#f7f8fa;border:1px solid #e6e8eb;
border-radius:8px;padding:10px 12px}
.kpi b{display:block;font-size:20px;margin-top:2px}
.pos{color:#c0392b} .neg{color:#1e8449}
/* 表格对齐：默认左对齐，数字列按表显式右对齐（表头与单元格成对设置，
   避免出现表头右、内容左的错位） */
.tbl{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}
.tbl td,.tbl th{border-bottom:1px solid #ececec;padding:6px 8px;text-align:left;
white-space:nowrap}
.tbl th{background:#f7f8fa;font-weight:600}
.tbl td:last-child{white-space:normal}
/* 指令表：目标权重% / 限价 */
.otbl td:nth-child(4),.otbl th:nth-child(4),
.otbl td:nth-child(5),.otbl th:nth-child(5){text-align:right}
/* 持仓表：持有日数 / 权重% / 浮动盈亏%（建仓日为日期，左对齐） */
.ptbl td:nth-child(4),.ptbl th:nth-child(4),
.ptbl td:nth-child(5),.ptbl th:nth-child(5),
.ptbl td:nth-child(6),.ptbl th:nth-child(6){text-align:right}
/* 历史表：累计 / 当日 / 回撤 */
.htbl td:nth-child(2),.htbl th:nth-child(2),
.htbl td:nth-child(3),.htbl th:nth-child(3),
.htbl td:nth-child(4),.htbl th:nth-child(4){text-align:right}
/* 清仓记录表：持有日数 / 买卖均价 / 净盈亏 */
.rtbl td:nth-child(5),.rtbl th:nth-child(5),
.rtbl td:nth-child(6),.rtbl th:nth-child(6),
.rtbl td:nth-child(7),.rtbl th:nth-child(7),
.rtbl td:nth-child(8),.rtbl th:nth-child(8){text-align:right}
/* 回测页数值表：首列为标签，其余全为数字 */
.ntbl td:not(:first-child),.ntbl th:not(:first-child){text-align:right}
h1{font-size:22px;margin:8px 0} h2{font-size:16px;margin:26px 0 6px;
border-left:3px solid #1f6feb;padding-left:8px}
.alert{background:#c0392b;color:#fff;padding:10px 14px;border-radius:6px;font-weight:600}
.ok{color:#1e8449} .bad{color:#c0392b;font-weight:600}
.muted{color:#8b8b8b;font-size:12px}
.card{display:block;border:1px solid #e6e8eb;border-radius:10px;padding:14px 16px;
margin:10px 0;text-decoration:none;color:inherit}
.card:hover{border-color:#1f6feb;background:#fbfcff}
</style>
